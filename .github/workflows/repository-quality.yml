name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    name: repository-quality
    uses: openAMRobot/.github/.github/workflows/repository-quality-reusable.yml@main
    with:
      # Runs job quality/test (rollout/verify.sh); suites are set in .openamrobot/verify.env.
      verify: true
      verify_container: ros:jazzy-ros-base
